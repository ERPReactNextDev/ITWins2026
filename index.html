<title>Department Wins 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: fixed 1920x1080 stage scaled to fit any screen, one slide at a time, no scrolling.
   Dark control-room look: ink background, mint signal accent, amber for highlights. */
:root{
  --ink:#050911;
  --ink-2:#0b1424;
  --panel:rgba(16,27,46,.72);
  --line:rgba(160,190,230,.16);
  --text:#eaf2fc;
  --mute:#93a6c2;
  --mint:#3df0c1;
  --amber:#ffb454;
  --sky:#4da8ff;
  --rose:#ff7a9c;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--f-body)}
body{position:fixed;inset:0}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#loader{position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s}
#loader.hidden{opacity:0;visibility:hidden}
#loader .spinner{width:48px;height:48px;border:3px solid rgba(61,240,193,.2);border-top-color:var(--mint);border-radius:50%;animation:spin 1s linear infinite}
#loader p{font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.38;pointer-events:none}
.orb.o1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:radial-gradient(circle,#0f6b66,transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.orb.o2{width:55vmax;height:55vmax;right:-18vmax;bottom:-22vmax;background:radial-gradient(circle,#1a3f86,transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.orb.o3{width:30vmax;height:30vmax;right:20vw;top:-10vmax;background:radial-gradient(circle,#7a4a14,transparent 65%);opacity:.22;animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vmax,-6vmax) scale(1.1)}}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(5,9,17,.35),rgba(5,9,17,.6));
  box-shadow:0 0 0 1px var(--line),0 40px 160px rgba(0,0,0,.6)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:96px 96px;opacity:.16;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none}

.slide{position:absolute;inset:0;padding:64px 90px 130px;visibility:hidden;opacity:0;z-index:1;transition:opacity .6s ease}
.slide.active{visibility:visible;opacity:1;z-index:2}
.slide.leaving{visibility:visible;opacity:0;z-index:1}
.slide.active.tr-zoom{animation:inZoom .9s cubic-bezier(.2,.8,.2,1)}
.slide.active.tr-slide{animation:inSlide .9s cubic-bezier(.2,.8,.2,1)}
.slide.active.tr-slide.back{animation-name:inSlideB}
.slide.active.tr-wipe{animation:inWipe 1s cubic-bezier(.7,0,.2,1)}
@keyframes inZoom{from{opacity:0;transform:scale(.93);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes inSlide{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
@keyframes inSlideB{from{opacity:0;transform:translateX(-140px)}to{opacity:1;transform:none}}
@keyframes inWipe{from{clip-path:inset(0 100% 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:1}}

.a{opacity:1}
.slide.active .a{animation:rise .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 90ms + 180ms)}
.slide.active .a.l{animation-name:riseL}
.slide.active .a.z{animation-name:riseZ}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes riseL{from{opacity:0;transform:translateX(-50px)}}
@keyframes riseZ{from{opacity:0;transform:scale(.8)}}

/* common type */
.eyebrow{display:flex;align-items:center;gap:16px;font-family:var(--f-mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.eyebrow .pn{color:var(--mint);font-weight:700}
.eyebrow .tag{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:rgba(255,255,255,.04)}
.eyebrow .tag.web{color:var(--amber)} .eyebrow .tag.infra{color:var(--sky)} .eyebrow .tag.fun{color:var(--rose)} .eyebrow .tag.sys{color:var(--mint)}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}

/* title slide */
.title-wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 720px;align-items:center;gap:40px;position:relative}
.badge{display:inline-flex;gap:12px;align-items:center;padding:10px 22px;border-radius:999px;border:1px solid rgba(61,240,193,.35);background:rgba(61,240,193,.08);font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.badge i{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(61,240,193,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 16px rgba(61,240,193,0)}100%{box-shadow:0 0 0 0 rgba(61,240,193,0)}}
.big{font-size:150px;font-weight:800;line-height:.95;margin:30px 0 0;white-space:nowrap}
.big .ch{display:inline-block;animation:chIn .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i) * 45ms + 300ms)}
.slide:not(.active) .big .ch{animation:none}
@keyframes chIn{from{opacity:0;transform:translateY(80px) rotate(6deg);filter:blur(10px)}}
.big .w2{color:var(--mint);text-shadow:0 0 60px rgba(61,240,193,.35)}
@keyframes shimmer{to{background-position:-200% 0}}
.yr{font-size:150px;-webkit-text-stroke:3px var(--text);color:transparent;margin-left:26px}
.sub{font-size:30px;color:var(--mute);margin:36px 0 0;max-width:880px;line-height:1.45}
.sub b{color:var(--text);font-weight:500}
.stack{position:relative;height:820px}
.card3{position:absolute;width:600px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 90px -20px rgba(0,0,0,.7);background:#fff}
.card3 .fl{animation:float1 9s ease-in-out infinite}.card3.c2 .fl{animation:float2 11s ease-in-out infinite}.card3 img{display:block;width:100%}
.card3.c1{left:100px;top:0;transform:rotate(4deg)}
.card3.c2{left:0;top:250px;transform:rotate(-3deg)}
.card3.c3{left:120px;top:490px;transform:rotate(2deg)}
@keyframes float1{50%{translate:0 -18px}}
@keyframes float2{50%{translate:0 16px}}
.ticker{position:absolute;left:0;right:0;bottom:104px;height:46px;overflow:hidden;border-block:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ticker div{display:flex;gap:60px;width:max-content;height:100%;align-items:center;animation:tick 70s linear infinite;font-family:var(--f-mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.ticker span::before{content:"";display:inline-block;width:8px;height:8px;background:var(--mint);transform:rotate(45deg);margin-right:60px;vertical-align:middle}
@keyframes tick{to{transform:translateX(-50%)}}

/* overview */
.ov-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.ov-head h2{font-size:92px;font-weight:800}
.counts{display:flex;gap:56px}
.counts div{display:flex;flex-direction:column;gap:6px}
.counts b{font-family:var(--f-display);font-size:84px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.counts span{font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.counts .c-sys b{color:var(--mint)} .counts .c-web b{color:var(--amber)} .counts .c-infra b{color:var(--sky)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:40px}
.tile{position:relative;height:150px;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .25s,border-color .25s,background .25s;overflow:hidden}
.tile:hover{transform:translateY(-6px);border-color:var(--mint);background:rgba(61,240,193,.08)}
.tile .n{font-family:var(--f-mono);font-size:17px;letter-spacing:.1em;color:var(--mute);display:flex;justify-content:space-between}
.tile .n i{font-style:normal;width:12px;height:12px;border-radius:50%;background:var(--mint)}
.tile.web .n i{background:var(--amber)} .tile.infra .n i{background:var(--sky)} .tile.fun .n i{background:var(--rose)}
.tile h3{margin:0;font-family:var(--f-display);font-size:25px;line-height:1.12;font-weight:700;text-wrap:balance}

/* intro slide */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 800px;gap:60px;height:100%;align-items:center}
.intro-text{display:flex;flex-direction:column;gap:26px;min-width:0}
.intro h1{font-weight:800}
.intro h1.s1{font-size:92px}.intro h1.s2{font-size:74px}.intro h1.s3{font-size:60px}
.lead{font-size:28px;line-height:1.48;color:#c3d1e6;margin:0;max-width:960px}
.status{display:flex;align-items:center;gap:22px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;background:rgba(61,240,193,.12);border:1px solid rgba(61,240,193,.4);color:var(--mint);font-family:var(--f-mono);font-size:20px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.pill svg{width:22px;height:22px}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;max-width:520px}
.bar b{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));transform-origin:left;box-shadow:0 0 24px rgba(61,240,193,.6)}
.slide.active .bar b{animation:fill 1.6s cubic-bezier(.3,.8,.2,1) both;animation-delay:1s}
@keyframes fill{from{transform:scaleX(0)}}
.caps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 36px}
.caps li{display:flex;gap:14px;font-size:24px;line-height:1.3;color:var(--text);align-items:flex-start}
.caps li svg{flex:none;width:26px;height:26px;color:var(--mint);margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chip b{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--mint);line-height:1.1;overflow-wrap:anywhere}
.chip:nth-child(2) b{color:var(--sky)}.chip:nth-child(3) b{color:var(--amber)}.chip:nth-child(4) b{color:var(--rose)}
.chip span{font-family:var(--f-mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.visual{position:relative;height:820px;min-width:0}
.fan .fc{position:absolute;width:680px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 40px 90px -24px rgba(0,0,0,.75)}
.fan .fc img{display:block;width:100%;height:auto}
.fan .fc.f1{left:120px;top:10px;transform:rotate(3deg)}
.fan .fc .fl{animation:float1 9s ease-in-out infinite}.fan .fc.f2 .fl{animation:float2 11s ease-in-out infinite}
.fan .fc.f2{left:10px;top:230px;transform:rotate(-3deg);z-index:2}
.fan .fc.f3{left:110px;top:455px;transform:rotate(2deg);z-index:3}
.fan.ph .fc{width:250px;border-radius:30px;border:8px solid #1b2538;background:#000;top:60px}
.fan.ph .fc.f1{left:0;top:80px;transform:rotate(-5deg)}
.fan.ph .fc.f2{left:270px;top:10px;transform:rotate(0)}
.fan.ph .fc.f3{left:540px;top:100px;transform:rotate(5deg)}
.fan.ph .fc img{height:520px;object-fit:cover;object-position:top}
.orbwrap{position:absolute;inset:0;display:grid;place-items:center}
.orbbox{position:relative;width:520px;height:520px;display:grid;place-items:center}
.orbbox::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(61,240,193,.28),transparent 68%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(61,240,193,.45);animation:spin 28s linear infinite}
.ring.r2{inset:-48px;border-color:rgba(77,168,255,.4);animation-duration:44s;animation-direction:reverse}
.ring.r3{inset:60px;border-style:solid;border-color:rgba(255,180,84,.35);animation-duration:60s}
@keyframes spin{to{transform:rotate(360deg)}}
.ring::after{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 20px var(--mint)}
.ring.r2::after{background:var(--sky);box-shadow:0 0 20px var(--sky)}
.ring.r3::after{background:var(--amber);box-shadow:0 0 20px var(--amber)}
.orbbox .ic{position:relative;width:230px;height:230px;color:var(--mint);filter:drop-shadow(0 0 30px rgba(61,240,193,.6));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.taglines{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.taglines span{font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:10px 20px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text)}

/* browser frame */
.frame{position:relative;border-radius:16px;overflow:hidden;background:#fff;border:1px solid rgba(160,190,230,.28);box-shadow:0 50px 140px -30px rgba(61,240,193,.28),0 30px 80px rgba(0,0,0,.6);transform-style:preserve-3d;transition:transform .25s ease-out}
.frame .tb{height:44px;background:#121c2f;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--line)}
.frame .tb i{width:13px;height:13px;border-radius:50%;background:#ff6159}.frame .tb i:nth-child(2){background:#ffbd2e}.frame .tb i:nth-child(3){background:#28c840}
.frame .tb span{margin-left:16px;font-family:var(--f-mono);font-size:15px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.frame .pic{overflow:hidden;line-height:0}
.frame img{display:block;max-height:690px;max-width:1740px;width:auto;height:auto}
.slide.active .frame img{animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.045)}}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%)}
.slide.active .frame::after{animation:sweep 1.6s ease-out 1.1s both}
@keyframes sweep{to{transform:translateX(120%)}}
.shot{display:flex;flex-direction:column;height:100%;gap:22px}
.shot-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.shot-head h2{font-size:64px;font-weight:800;margin-top:12px}
.shot-head .cnt{font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;color:var(--mute);padding-bottom:10px;white-space:nowrap}
.shot-head .cnt b{color:var(--mint)}
.shot-body{flex:1;display:grid;place-items:center;perspective:1600px;min-height:0}
.hero-frame{width:100%}.hero-frame img{width:100%;max-height:none}

/* section dividers */
.sec{display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:70px;height:100%;align-items:center;position:relative}
.sec.sys{--c:var(--mint)}.sec.web{--c:var(--amber)}.sec.infra{--c:var(--sky)}.sec.fun{--c:var(--rose)}
.sec-num{position:absolute;left:-10px;top:50%;transform:translateY(-62%);font-family:var(--f-display);font-weight:800;font-size:520px;line-height:1;letter-spacing:-.04em;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 20%,transparent);color:transparent;pointer-events:none;white-space:nowrap}
.sec-text{position:relative;display:flex;flex-direction:column;gap:30px}
.sec-text .eyebrow .pn{color:var(--c)}
.sec-title{font-size:200px;font-weight:800;line-height:.92;color:var(--text);text-shadow:0 0 80px color-mix(in srgb,var(--c) 35%,transparent)}
.sec-title.long{font-size:122px;line-height:1}
.sec-title em{font-style:normal;color:var(--c)}
.sec-desc{font-size:32px;line-height:1.45;color:#c3d1e6;margin:0;max-width:820px}
.sec-count{display:flex;align-items:baseline;gap:16px;font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sec-count b{font-family:var(--f-display);font-size:84px;letter-spacing:0;color:var(--c);line-height:1}
.sec-bar{width:260px;height:6px;border-radius:9px;background:var(--c);box-shadow:0 0 30px var(--c);transform-origin:left}
.slide.active .sec-bar{animation:fill 1.2s cubic-bezier(.3,.8,.2,1) .5s both}
.sec-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.sli{display:flex;gap:16px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-family:var(--f-display);font-size:27px;font-weight:700;line-height:1.15;cursor:pointer;transition:transform .25s,border-color .25s,background .25s;min-width:0}
.sli:hover{transform:translateX(6px);border-color:var(--c)}
.sli span{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--c);flex:none}
.sli.solo{grid-column:1/-1}

/* galleries */
.gal{display:flex;flex-direction:column;height:100%;gap:26px}
.gal-head{display:flex;justify-content:space-between;gap:60px;align-items:flex-end}
.gal-head h2{font-size:64px;font-weight:800;margin-top:12px}
.gal-head p{margin:0;font-size:24px;line-height:1.45;color:#c3d1e6;max-width:820px}
.gal-row{flex:1;display:flex;justify-content:center;align-items:center;gap:22px;min-height:0}
.gi{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.7);background:#0b1424;flex:none}
.gi img{display:block;width:100%;height:100%;object-fit:cover}
.gi.phone{border:9px solid #1b2538;border-radius:38px;background:#000}
.gi.phone::before{content:"";position:absolute;top:10px;left:50%;width:70px;height:7px;margin-left:-35px;border-radius:9px;background:#000;z-index:2;opacity:.7}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.gcap{font-family:var(--f-mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.slide.active .gi{animation:pop .8s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--d,0) * 110ms + 250ms)}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.9) rotate(var(--r,0deg))}}


/* ===== added: problem line, summary, integration map ===== */
.intro-text{gap:18px}.caps{gap:8px 36px}
.prob{display:flex;align-items:baseline;gap:18px;max-width:900px;padding:10px 20px;border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(255,180,84,.10),transparent);border-radius:0 12px 12px 0}
.prob b{flex:none;font-family:var(--f-mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.prob span{font-size:24px;line-height:1.3;color:#e3ecf8}

.sx-head h2{font-size:92px;font-weight:800;margin-top:18px}

function layoutRow(ids,maxH,opts={}){
  const gap=opts.gap||22,b=opts.b||0,W=1740;
  const sum=ids.reduce((a,id)=>a+AR[id],0);
  const h=Math.min(maxH,(W-gap*(ids.length-1)-2*b*ids.length)/sum);
  return ids.map((id,k)=>{
    const w=Math.round(AR[id]*h+2*b),hh=Math.round(h+2*b);
    const rot=(k%2?1:-1)*(opts.rot||0);
    return `<div class="gwrap"><div class="gi${b?" phone":""} a" style="--d:${k+1};--r:${rot}deg;width:${w}px;height:${hh}px"><img src="img/${id}.webp" loading="lazy" alt=""></div>${opts.caps?`<div class="gcap a" style="--d:${k+2}">${opts.caps[k]}</div>`:""}</div>`;
  }).join("");
}

function build(){
  slides.push(titleSlide());
  slides.push(overviewSlide());
  slides.push(summarySlide());
  let prevCat=null;
  P.forEach((p,i)=>{
    if(p.cat!==prevCat){if(p.cat==="fun"){slides.push(mapSlide());slides.push(challengeSlide());slides.push(lessonSlide());slides.push(roadmapSlide())}slides.push(sectionSlide(p.cat));prevCat=p.cat}
    jump[p.id]=slides.length;
    slides.push(introSlide(p,i));
    if(p.mode==="hero"||p.mode==="orb")return;
    if(p.id==="carmona"){
      p.groups.forEach((g,gi)=>slides.push({tr:"zoom",say:(gi&&p.groups[gi-1].h===g.h)?`More photos from the ${g.h}.`:g.p,proj:p.id,html:`<div class="gal">${galleryHead(p,i,g.h,g.p)}<div class="gal-row">${layoutRow(g.ids,640,{rot:2})}</div></div>`}));
      return;
    }
    if(p.id==="bloopers"){
      const n=4,pages=Math.ceil(BL.length/n);
      for(let k=0;k<pages;k++){
        const ids=BL.slice(k*n,k*n+n);
        slides.push({tr:k%2?"slide":"zoom",say:k===0?"Now the fun part. Here are the bloopers, the funny moments behind the scenes.":k===pages-1?"And that is our team. Thank you for the laughs.":"More memorable moments from the team.",proj:p.id,html:`<div class="gal">${galleryHead(p,i,"Behind the scenes",null,`<b>${k+1}</b> / ${pages}`)}<div class="gal-row">${layoutRow(ids,720,{rot:2})}</div></div>`});
      }
      return;
    }
    if(p.mode==="phone"){
      slides.push({tr:"zoom",say:"Biolog is a mobile app. Here are its dashboard, calendar, camera, camera view, and reports screens.",proj:p.id,html:`<div class="gal">${galleryHead(p,i,"Mobile app screens",null,"")}<div class="gal-row">${layoutRow(p.shots.map(s=>s[0]),700,{b:9,gap:34,rot:1.5,caps:p.shots.map(s=>s[1])})}</div></div>`});
      return;
    }
    p.shots.forEach((s,k)=>slides.push(shotSlide(p,i,k,k%2?"slide":"zoom")));
  });
  slides.push({tr:"zoom",confetti:true,say:"These moments make our journey even more memorable. Thank you for being part of our success!",html:`
  <div class="end">
    <div class="eyebrow a l"><span class="pn">The end</span><span>${total-1} wins · 2026</span></div>
    <h2 class="a" style="--d:1"><span>Thank You!</span></h2>
    <p class="a" style="--d:3">These moments make our journey even more memorable. Thank you for being part of our success!</p>
  </div>`});
}
build();

  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize",fit);fit();

/* ---------- navigation ---------- */
let cur=-1,lock=false;
const progEl=document.getElementById("prog"),countEl=document.getElementById("count");
function countUp(e){
  e.querySelectorAll("[data-count]").forEach(n=>{
    const to=+n.dataset.count,t0=performance.now()+700;
    (function tick(t){const k=Math.min(1,Math.max(0,(t-t0)/1200));n.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)})(performance.now());
  });
}
function go(i,dir){
  i=Math.max(0,Math.min(slides.length-1,i));
  if(i===cur)return;
  const back=dir!==undefined?dir<0:i<cur;
  const prev=els[cur],next=els[i];
  if(prev){prev.classList.remove("active");prev.classList.add("leaving");setTimeout(()=>prev.classList.remove("leaving"),700)}
  next.classList.remove("leaving");next.classList.toggle("back",back);
  void next.offsetWidth;
  next.classList.add("active");
  cur=i;
  progEl.style.width=(i/(slides.length-1)*100)+"%";
  countEl.innerHTML=`<b>${pad(i+1)}</b> / ${pad(slides.length)}`;
  countUp(next);
  if(slides[i].confetti)confetti();
  if(typeof speakSlide==="function")speakSlide();
  if(typeof schedAuto==="function")schedAuto();
  try{history.replaceState(null,"","#s"+(i+1))}catch(e){}
}
const next=()=>go(cur+1,1),prev=()=>go(cur-1,-1);
document.getElementById("bNext").onclick=e=>{e.stopPropagation();next()};
document.getElementById("bPrev").onclick=e=>{e.stopPropagation();prev()};
addEventListener("keydown",e=>{
  const k=e.key;
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k)){e.preventDefault();next()}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){e.preventDefault();prev()}
  else if(k==="Home")go(0);
  else if(k==="End")go(slides.length-1);
  else if(k==="f"||k==="F")toggleFull();
  else if(k==="a"||k==="A")toggleAuto();
});
/* click edges, swipe */
stage.addEventListener("click",e=>{
  if(e.target.closest("button,.tile"))return;
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(x<.2)prev();else next();
});
let tx=null;
stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)(d<0?next:prev)();tx=null});
let wheelT=0;
addEventListener("wheel",e=>{const n=Date.now();if(n-wheelT<900||Math.abs(e.deltaY)<20)return;wheelT=n;(e.deltaY>0?next:prev)()},{passive:true});

/* ---------- AI voice narration (Web Speech API) ---------- */
const synth=window.speechSynthesis;
const bVoice=document.getElementById("bVoice"),vSel=document.getElementById("vSel"),vRate=document.getElementById("vRate"),vAuto=document.getElementById("vAuto"),vPanel=document.getElementById("vpanel"),badge=document.getElementById("sayBadge");
let voiceOn=false,voices=[],speakTimer=null,advTimer=null,token=0;
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices();
  const score=v=>{let s=0;const n=(v.name+" "+v.lang).toLowerCase();
    if(/^en/i.test(v.lang))s+=5; if(/en-ph|fil|tl-/i.test(n))s+=4;
    if(/natural|neural|online|google|premium|enhanced/.test(n))s+=6;
    if(/en-us|en-gb|en-au/i.test(v.lang))s+=1; return s};
  const sorted=voices.slice().sort((a,b)=>score(b)-score(a));
  const prev=vSel.value;
  vSel.innerHTML=sorted.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join("");
  try{const saved=localStorage.getItem("voiceURI");if(saved&&sorted.some(v=>v.voiceURI===saved))vSel.value=saved;else if(prev)vSel.value=prev}catch(e){}
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
else{bVoice.title="Voice not supported in this browser";bVoice.style.opacity=.4}
function pickVoice(){return voices.find(v=>v.voiceURI===vSel.value)||voices.find(v=>/^en/i.test(v.lang))||null}
function chunk(t){return (t.match(/[^.!?]+[.!?]*/g)||[t]).map(x=>x.trim()).filter(Boolean)}
function stopSpeak(){token++;clearTimeout(speakTimer);clearTimeout(advTimer);if(synth)synth.cancel();badge.classList.remove("on")}
function speakSlide(){
  if(!voiceOn||!synth)return;
  stopSpeak();const my=token;
  const text=slides[cur]&&slides[cur].say;if(!text)return;
  speakTimer=setTimeout(()=>{
    const parts=chunk(text),v=pickVoice();
    badge.classList.add("on");
    parts.forEach((part,k)=>{
      const u=new SpeechSynthesisUtterance(part);
      if(v){u.voice=v;u.lang=v.lang}
      u.rate=parseFloat(vRate.value)||1;u.pitch=1;
      if(k===parts.length-1){
        const done=()=>{if(my!==token)return;badge.classList.remove("on");
          if(vAuto.checked&&cur<slides.length-1)advTimer=setTimeout(()=>{if(my===token)next()},1400)};
        u.onend=done;u.onerror=done;
      }
      synth.speak(u);
    });
  },1100);
}
function setVoice(on){
  voiceOn=on;bVoice.classList.toggle("on",on);
  if(on){if(auto)stopAuto();speakSlide()}else stopSpeak();
}
bVoice.onclick=e=>{e.stopPropagation();setVoice(!voiceOn);vPanel.hidden=!(voiceOn||auto)};
vPanel.addEventListener("click",e=>e.stopPropagation());
vSel.onchange=()=>{try{localStorage.setItem("voiceURI",vSel.value)}catch(e){}if(voiceOn)speakSlide()};
vRate.oninput=()=>{document.getElementById("vRateV").textContent=(+vRate.value).toFixed(1)+"x"};
vRate.onchange=()=>{if(voiceOn)speakSlide()};
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("#vpanel"))return;if(e.key==="v"||e.key==="V"){setVoice(!voiceOn);vPanel.hidden=!(voiceOn||auto)}});
/* fullscreen / autoplay / idle */
function toggleFull(){
  try{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}) }catch(e){}
}
document.getElementById("bFull").onclick=e=>{e.stopPropagation();toggleFull()};
let auto=false,autoT=null;
const bPlay=document.getElementById("bPlay"),apBar=document.getElementById("ap"),vPace=document.getElementById("vPace");
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function dwell(i){const w=((slides[i]&&slides[i].say)||"").split(/\s+/).length;return Math.min(22,Math.max(6,4+w/3))*parseFloat(vPace.value)*1000}
function resetBar(){apBar.style.transition="none";apBar.style.width="0"}
function schedAuto(){
  clearTimeout(autoT);resetBar();
  if(!auto||document.hidden)return;
  if(cur>=slides.length-1){stopAuto();return}
  const d=dwell(cur);void apBar.offsetWidth;
  apBar.style.transition=`width ${d}ms linear`;apBar.style.width="100%";
  autoT=setTimeout(()=>next(),d);
}
function stopAuto(){auto=false;clearTimeout(autoT);resetBar();bPlay.classList.remove("on");bPlay.innerHTML=ICON_PLAY;bPlay.title="Autoplay (A)";if(!voiceOn)vPanel.hidden=true}
function toggleAuto(){
  if(auto){stopAuto();return}
  if(voiceOn)setVoice(false);
  auto=true;bPlay.classList.add("on");bPlay.innerHTML=ICON_PAUSE;bPlay.title="Pause autoplay (A)";vPanel.hidden=false;
  if(cur>=slides.length-1)go(0,1);else schedAuto();
}
vPace.onchange=()=>{if(auto)schedAuto()};
document.addEventListener("visibilitychange",()=>{if(auto)schedAuto()});
bPlay.onclick=e=>{e.stopPropagation();toggleAuto()};
let idleT;
function wake(){document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),3500)}
addEventListener("mousemove",wake);wake();
setTimeout(()=>{const h=document.getElementById("hint");h.style.opacity=0},7000);

/* 3D tilt on screenshots */
stage.addEventListener("mousemove",e=>{
  const f=els[cur]&&els[cur].querySelector("[data-tilt]");if(!f)return;
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  f.style.transform=`rotateY(${x*5}deg) rotateX(${-y*4}deg)`;
});

/* ---------- background particles ---------- */
(function(){
  const c=document.getElementById("bg"),x=c.getContext("2d");
  let W,H,pts=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;const n=Math.round(W*H/22000);pts=Array.from({length:Math.min(90,n)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6}))}
  size();addEventListener("resize",size);
  function loop(){
    x.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
    for(let i=0;i<pts.length;i++){
      const a=pts[i];
      x.fillStyle="rgba(61,240,193,.55)";x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
      for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){x.strokeStyle=`rgba(77,168,255,${.18*(1-d/150)})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    }
    if(!reduce)requestAnimationFrame(loop);
  }
  loop();
})();

/* ---------- confetti ---------- */
function confetti(){
  const c=document.getElementById("fx"),x=c.getContext("2d");
  const cols=["#3df0c1","#4da8ff","#ffb454","#ff7a9c","#eaf2fc"];
  const ps=Array.from({length:180},()=>({x:Math.random()*1920,y:-Math.random()*600-40,vx:(Math.random()-.5)*5,vy:Math.random()*4+3,s:Math.random()*14+8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,1920,1080);t++;
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}
    if(t<420&&cur===slides.length-1)requestAnimationFrame(f);else x.clearRect(0,0,1920,1080);
  })();
}

/* start */
const loader=document.getElementById("loader");
window.addEventListener("load",()=>{
  setTimeout(()=>{loader.classList.add("hidden")},300);
});
const h=parseInt((location.hash||"").replace("#s",""),10);
go(Number.isFinite(h)?h-1:0,1);
